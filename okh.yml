licensor:
  name: Brennen Johnston
  contact:
    name: Brennen Johnston
documentation-language: en
function: |
  A 3D-printed accessibility switch with a 3.5 mm mono plug, the standard connector for
  switch-adapted toys, communication aids and switch interfaces. A small custom circuit
  board carries a 3.5 mm jack and a hot-swap socket for an ordinary Cherry MX compatible
  mechanical keyboard switch. The board is ordered pre-assembled, so the maker solders
  nothing: they press a keyboard switch into the socket by hand, push on one of five
  printed keycaps, and snap the printed housing together. Because the keyboard switch
  is held by friction rather than solder, the actuation force can be tuned to the person
  using the device (light for limited strength, heavier to avoid accidental activation,
  clicky for audible confirmation) and changed again later in seconds without tools.

